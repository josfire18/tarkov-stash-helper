# Auto-merges Dependabot PRs (security fixes, patch and minor updates) once the
# repo's own tests pass. Major bumps of libraries are left open for review;
# GitHub Actions version bumps (any size) merge automatically.
#
# Two jobs on purpose, so a freshly published package never runs next to a token
# that can push:
#   test       read-only token, and checkout leaves no credentials in .git/config.
#              This is the only place the bumped dependencies are installed and run.
#   automerge  holds the write token; checks nothing out and runs no third-party code.
#              (Keep this job id: Jarvis's GitHub upkeep ignores a failing "automerge"
#              check, which is expected on PRs that edit workflow files.)
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  test:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merge: ${{ steps.decide.outputs.merge }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Decide whether this update may merge by itself
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ] || [ "$ECOSYSTEM" = "github_actions" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Major library update: left open for review."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.merge == 'true'
        with: { persist-credentials: false }
      # OSV gate: fail only on vulnerabilities this PR adds (compare head scan with base scan).
      # Head results are set aside in RUNNER_TEMP while the base is checked out, so the
      # base scan does not see head files. Read-only: no write token is used here.
      - name: OSV-Scanner, scan PR head
        id: osv-head
        if: steps.decide.outputs.merge == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-new.json
            -r
            ./
      - name: Set head results aside
        if: steps.decide.outputs.merge == 'true'
        run: mv -f osv-new.json "$RUNNER_TEMP/osv-new.json" 2>/dev/null || true
      - name: Check out PR base for comparison
        if: steps.decide.outputs.merge == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: OSV-Scanner, scan PR base
        id: osv-base
        if: steps.decide.outputs.merge == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-old.json
            -r
            ./
      - name: Restore head results and check both scans completed
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        run: |
          mv -f "$RUNNER_TEMP/osv-new.json" osv-new.json 2>/dev/null || true
          if [ ! -s osv-old.json ] || [ ! -s osv-new.json ]; then
            echo "::error::OSV-Scanner did not write both result files (base: ${{ steps.osv-base.outcome }}, head: ${{ steps.osv-head.outcome }}). Failing rather than reporting no new vulnerabilities."
            exit 1
          fi
      - name: Fail only on vulnerabilities this PR introduces
        if: steps.decide.outputs.merge == 'true'
        uses: google/osv-scanner-action/osv-reporter-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --output=osv-results.sarif
            --old=osv-old.json
            --new=osv-new.json
            --gh-annotations=true
            --fail-on-vuln=true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.decide.outputs.merge == 'true' && hashFiles('package.json') != ''
        with: { node-version: 22 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.decide.outputs.merge == 'true' && hashFiles('tests/*.py') != ''
        with: { python-version: "3.12" }
      - name: Run the repo's tests (if it has any)
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        run: |
          set -e
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm ci && npm test
          fi
          if [ -d tests ] && ls tests/*.py >/dev/null 2>&1; then
            if [ -f pyproject.toml ]; then pip install -q -e ".[test]" 2>/dev/null || pip install -q -e .; fi
            for r in requirements*.txt; do [ -f "$r" ] && pip install -q -r "$r"; done
            pip install -q pytest pytest-asyncio
            pytest -q
          fi

  automerge:
    needs: test
    if: needs.test.outputs.merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
