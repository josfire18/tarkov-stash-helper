# Auto-merges Dependabot PRs (security fixes, patch and minor updates) once the
# repo's own tests pass. Major bumps of libraries are left open for review;
# GitHub Actions version bumps (any size) merge automatically.
#
# Two jobs on purpose, so a freshly published package never runs next to a token
# that can push:
#   test       read-only token, and checkout leaves no credentials in .git/config.
#              This is the only place the bumped dependencies are installed and run.
#   automerge  holds the write token; checks nothing out and runs no third-party code.
#              (Keep this job id: Jarvis's GitHub upkeep ignores a failing "automerge"
#              check, which is expected on PRs that edit workflow files.)
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  test:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merge: ${{ steps.decide.outputs.merge }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Decide whether this update may merge by itself
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ] || [ "$ECOSYSTEM" = "github_actions" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Major library update: left open for review."
          fi
      # OSV gate: the update may merge only if it adds no known vulnerability. The base
      # branch is scanned first and the PR second, so the tests below run on the PR's
      # code. osv-scanner exits 1 when it finds vulnerabilities, 128 when it finds no
      # lockfile, and other codes on errors; it can write a results file even when it
      # errors, so the exit code decides, and any scan error fails the job.
      - name: Check out the base branch for the OSV comparison
        if: steps.decide.outputs.merge == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Install OSV-Scanner (release binary, checksum-pinned)
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        env:
          OSV_SCANNER_VERSION: v2.7.1
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: OSV-Scanner, scan the base branch
        id: osv-base
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --no-resolve --format=json --output-file="$RUNNER_TEMP/osv-old.json" -r ./
          rc=$?
          set -e
          case "$rc" in
            0|1) echo "packages=true" >> "$GITHUB_OUTPUT" ;;
            128) echo "packages=false" >> "$GITHUB_OUTPUT"; echo '{"results":[]}' > "$RUNNER_TEMP/osv-old.json" ;;
            *) echo "::error::OSV-Scanner failed on the base branch (exit $rc)."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.merge == 'true'
        with: { persist-credentials: false }
      - name: OSV-Scanner, fail only on vulnerabilities this PR introduces
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        env:
          BASE_HAS_PACKAGES: ${{ steps.osv-base.outputs.packages }}
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --no-resolve --format=json --output-file="$RUNNER_TEMP/osv-new.json" -r ./
          rc=$?
          set -e
          case "$rc" in
            0|1) ;;
            128)
              if [ "$BASE_HAS_PACKAGES" = "true" ]; then
                echo "::error::OSV-Scanner found no lockfile on this PR but did on the base branch (lockfile removed or unreadable)."
                exit 1
              fi
              echo '{"results":[]}' > "$RUNNER_TEMP/osv-new.json" ;;
            *) echo "::error::OSV-Scanner failed on this PR (exit $rc)."; exit 1 ;;
          esac
          vulns() {
            jq -r '.results[]?.packages[]? | .package as $p | .vulnerabilities[]? | "\($p.ecosystem) \($p.name): \(.id)"' "$1" | LC_ALL=C sort -u
          }
          vulns "$RUNNER_TEMP/osv-old.json" > "$RUNNER_TEMP/osv-old.txt"
          vulns "$RUNNER_TEMP/osv-new.json" > "$RUNNER_TEMP/osv-new.txt"
          added=$(LC_ALL=C comm -13 "$RUNNER_TEMP/osv-old.txt" "$RUNNER_TEMP/osv-new.txt")
          if [ -n "$added" ]; then
            while IFS= read -r v; do echo "::error::Known vulnerability introduced by this PR: $v"; done <<< "$added"
            exit 1
          fi
          echo "No new known vulnerabilities ($(wc -l < "$RUNNER_TEMP/osv-old.txt") already on the base branch)."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.decide.outputs.merge == 'true' && hashFiles('package.json') != ''
        with: { node-version: 22 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.decide.outputs.merge == 'true' && hashFiles('tests/*.py') != ''
        with: { python-version: "3.12" }
      - name: Run the repo's tests (if it has any)
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        run: |
          set -e
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm ci && npm test
          fi
          if [ -d tests ] && ls tests/*.py >/dev/null 2>&1; then
            if [ -f pyproject.toml ]; then pip install -q -e ".[test]" 2>/dev/null || pip install -q -e .; fi
            for r in requirements*.txt; do [ -f "$r" ] && pip install -q -r "$r"; done
            pip install -q pytest pytest-asyncio
            pytest -q
          fi

  automerge:
    needs: test
    if: needs.test.outputs.merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
