# GitHub CodeQL code scanning (free for public repos). Results: Security tab -> Code scanning.
name: CodeQL

on:
  schedule:
    - cron: "41 9 * * 1"   # weekly full scan; push/PR scans cover changes
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
